version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - /srv/docker_conf/trade/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradepass}
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /srv/docker_conf/trade/redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build: 
      context: ./backend
    restart: unless-stopped
    volumes:
      - /srv/docker_conf/trade/backend_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://tradeuser:tradepass@db:5432/tradedb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_in_production}
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - /srv/docker_conf/trade/backend_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://tradeuser:tradepass@db:5432/tradedb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - /srv/docker_conf/trade/backend_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://tradeuser:tradepass@db:5432/tradedb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
      - celery_worker
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3090:80"
    depends_on:
      - backend
